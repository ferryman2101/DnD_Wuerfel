  text-shadow:0 2px 0 #5a360f, 0 0 3px #000, 0 0 20px rgba(0,0,0,.95);
}
.sub{
  margin-top:4px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;
  text-shadow:0 0 3px #000,0 0 10px #000;
}
.spacer{flex:1;min-height:12px}

/* ---------- Würfelbrett ---------- */
.tray{
  position:relative;
  padding:12px 10px 14px;
  border-radius:24px;
  background:
    radial-gradient(circle at 14px 14px, #f6d58a 0 3px, #6b4515 4px, transparent 5px),
    radial-gradient(circle at calc(100% - 14px) 14px, #f6d58a 0 3px, #6b4515 4px, transparent 5px),
    radial-gradient(circle at 14px calc(100% - 14px), #f6d58a 0 3px, #6b4515 4px, transparent 5px),
    radial-gradient(circle at calc(100% - 14px) calc(100% - 14px), #f6d58a 0 3px, #6b4515 4px, transparent 5px),
    linear-gradient(180deg, rgba(48,26,10,.72), rgba(18,9,3,.88));
  border:2px solid #b8863a;
  box-shadow:
    inset 0 0 0 1px rgba(255,225,160,.28),
    inset 0 0 0 6px rgba(0,0,0,.25),
    inset 0 0 40px rgba(0,0,0,.7),
    0 14px 40px rgba(0,0,0,.7);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}

.bar{
  display:flex;align-items:center;gap:10px;
  margin:0 6px 8px;padding:6px 6px 10px 14px;
  border-bottom:1px solid rgba(224,178,90,.35);
}
.total{display:flex;flex-direction:column;line-height:1;min-width:72px}
.total small{font-size:10px;letter-spacing:.25em;text-transform:uppercase;opacity:.75}
.total b{font-size:30px;font-weight:800;color:#fff3cf;text-shadow:0 0 10px rgba(255,190,90,.5)}
.info{
  flex:1;font-size:12px;line-height:1.35;opacity:.9;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.info.crit{color:#ffe28a;font-weight:800;font-size:15px;opacity:1;text-shadow:0 0 10px rgba(255,200,80,.9)}
.info.fumble{color:#ff8a7a;font-weight:800;font-size:15px;opacity:1;text-shadow:0 0 10px rgba(255,40,30,.8)}
.reset-all{
  flex:none;width:44px;height:44px;border-radius:50%;
  border:2px solid var(--gold);
  background:radial-gradient(circle at 35% 30%, #5b3a17, #24140a 70%);
  color:var(--gold-hi);font-size:22px;line-height:1;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,230,170,.3),0 3px 8px rgba(0,0,0,.6);
}
.reset-all:active{transform:scale(.92)}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-areas:
    "d4  d6  d8"
    "d10 d12 d100"
    "d20 d20 d20";
  gap:6px 4px;justify-items:center;align-items:center;
}

/* ---------- Würfel-Schaltflächen ---------- */
.die{
  position:relative;
  width:var(--die);height:var(--die);
  padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;
  outline:none;
}
.die.big{--die:min(36vw, 19dvh, 176px)}
.die svg{
  position:absolute;inset:0;width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 6px 5px rgba(0,0,0,.65));
  transition:filter .3s, transform .15s;
}
.die:active svg{transform:scale(.94)}
.die:focus-visible svg{filter:drop-shadow(0 0 6px #fff)}
.die .outline{stroke-width:3.4;stroke-linejoin:round}
.die .facet{fill:none;stroke:rgba(240,200,120,.55);stroke-width:1.4;stroke-linejoin:round}
.die .face-hi{fill:rgba(255,255,255,.07);stroke:rgba(250,215,140,.75);stroke-width:1.6;stroke-linejoin:round}

.face{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:translateY(calc(var(--cy, 50%) - 50%));
  pointer-events:none;line-height:1;
}
.val{
  font-weight:800;
  font-size:calc(var(--die) * .2);
  color:var(--gold-hi);
  text-shadow:0 2px 0 rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.9);
  letter-spacing:.02em;
}
.tag{
  font-size:calc(var(--die) * .095);font-weight:600;letter-spacing:.12em;
  color:rgba(251,231,176,.85);text-shadow:0 1px 2px #000;
  height:0;overflow:visible;opacity:0;transition:opacity .2s;
}
.die.rolled .val{
  font-size:calc(var(--die) * var(--vs, .34));
  color:#fff6dc;
  animation:pop .38s cubic-bezier(.2,1.6,.4,1) both;
}
.die.rolled .tag{opacity:1;margin-top:2px}
.die.rolled svg{filter:drop-shadow(0 0 10px rgba(255,200,110,.55)) drop-shadow(0 6px 5px rgba(0,0,0,.6))}
.die.rolling svg{animation:tumble .6s ease-in-out}
.die.rolling .val{font-size:calc(var(--die) * var(--vs, .34));color:rgba(255,246,220,.75);animation:none}
.die.crit svg{animation:critGlow 1.1s ease-in-out infinite alternate}
.die.crit .val{color:#ffe9a0;text-shadow:0 0 12px #ffcc40,0 2px 0 #000}
.die.fumble svg{filter:drop-shadow(0 0 14px rgba(255,30,20,.8)) drop-shadow(0 6px 5px rgba(0,0,0,.6));animation:shudder .45s ease-in-out}
.die.fumble .val{color:#ff9d8c}

@keyframes tumble{
  0%{transform:rotate(0) scale(1)}
  20%{transform:rotate(-28deg) scale(.86)}
  45%{transform:rotate(22deg) scale(1.06)}
  70%{transform:rotate(-12deg) scale(.95)}
  100%{transform:rotate(0) scale(1)}
}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes critGlow{
  from{filter:drop-shadow(0 0 8px rgba(255,210,90,.7)) drop-shadow(0 6px 5px rgba(0,0,0,.6))}
  to{filter:drop-shadow(0 0 22px rgba(255,220,100,1)) drop-shadow(0 6px 5px rgba(0,0,0,.6))}
}
@keyframes shudder{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

.hint{
  text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  margin-top:8px;opacity:.6;
}
@media (prefers-reduced-motion: reduce){
  .die.rolling svg,.die.crit svg,.die.fumble svg,.die.rolled .val{animation:none}
}
</style>

<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs id="defs">
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c1"/>
      <stop offset=".3" stop-color="#e0b050"/>
      <stop offset=".55" stop-color="#8a5a1c"/>
      <stop offset=".8" stop-color="#f0c870"/>
      <stop offset="1" stop-color="#6a4414"/>
    </linearGradient>
  </defs>
</svg>

<div class="app">
  <header>
    <h1>Drachenwürfel</h1>
    <div class="sub">Tippe auf einen Würfel</div>
  </header>
  <div class="spacer"></div>

  <main class="tray">
    <div class="bar">
      <div class="total"><small>Summe</small><b id="total">–</b></div>
      <div class="info" id="info">Noch nicht gewürfelt</div>
      <button class="reset-all" id="resetAll" aria-label="Alle Würfel zurücksetzen">↺</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="hint">Erneut tippen zum Zurücksetzen</div>
  </main>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Fairer Zufall: crypto.getRandomValues + Rejection-Sampling ----------
     Verhindert die Modulo-Verzerrung: Werte oberhalb des größten Vielfachen
     von "sides" werden verworfen, so ist jede Seite exakt gleich wahrscheinlich. */
  const buf = new Uint32Array(1);
  function roll(sides){
    if (!(window.crypto && crypto.getRandomValues)) {
      return 1 + Math.floor(Math.random() * sides);
    }
    const limit = Math.floor(0x100000000 / sides) * sides;
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return 1 + (x % sides);
  }

  /* ---------- Formen (viewBox 0 0 100 100) ---------- */
  const pts = a => a.map(p => p.join(",")).join(" ");
  const ring = (n, r, cx, cy, rot) =>
    Array.from({length:n}, (_, i) => {
      const t = rot + i * 2 * Math.PI / n;
      return [+(cx + r * Math.cos(t)).toFixed(2), +(cy + r * Math.sin(t)).toFixed(2)];
    });

  function shape(sides){
    switch (sides){
      case 4: {
        const A=[50,5], B=[96,90], C=[4,90], M=[50,62];
        return { outer:`<polygon points="${pts([A,B,C])}"/>`,
          facets:`<polyline points="${pts([A,M,B])}"/><line x1="4" y1="90" x2="50" y2="62"/>`,
          cy:"64%", vs:.3 };
      }
      case 6:
        return { outer:`<rect x="7" y="7" width="86" height="86" rx="12"/>`,
          facets:`<rect class="face-hi" x="19" y="19" width="62" height="62" rx="6"/>
                  <line x1="10" y1="10" x2="19" y2="19"/><line x1="90" y1="10" x2="81" y2="19"/>
                  <line x1="10" y1="90" x2="19" y2="81"/><line x1="90" y1="90" x2="81" y2="81"/>`,
          cy:"50%", vs:.36 };
      case 8: {
        const T=[50,3], R=[96,50], B=[50,97], L=[4,50], fl=[19,64], fr=[81,64];
        return { outer:`<polygon points="${pts([T,R,B,L])}"/>`,
          facets:`<polygon class="face-hi" points="${pts([T,fr,fl])}"/>
                  <polyline points="${pts([L,fl,B,fr,R])}"/>`,
          cy:"47%", vs:.3 };
      }
      case 10: {
        const T=[50,3], R=[96,47], B=[50,97], L=[4,47], fl=[24,58], fr=[76,58], fb=[50,71];
        return { outer:`<polygon points="${pts([T,R,B,L])}"/>`,
          facets:`<polygon class="face-hi" points="${pts([T,fr,fb,fl])}"/>
                  <line x1="4" y1="47" x2="24" y2="58"/><line x1="96" y1="47" x2="76" y2="58"/>
                  <line x1="50" y1="71" x2="50" y2="97"/>`,
          cy:"46%", vs:.3 };
      }
      case 12: {
        const out = ring(10, 47, 50, 51, -Math.PI/2);
        const inn = ring(5, 27, 50, 51, -Math.PI/2);
        const spokes = inn.map((p, i) => `<line x1="${p[0]}" y1="${p[1]}" x2="${out[i*2][0]}" y2="${out[i*2][1]}"/>`).join("");
        return { outer:`<polygon points="${pts(out)}"/>`,
          facets:`<polygon class="face-hi" points="${pts(inn)}"/>${spokes}`,
          cy:"52%", vs:.3 };
      }
      case 20: {
        const h = ring(6, 48, 50, 50, -Math.PI/2);       // Sechseck-Umriss
        const t = [[50,19],[79,69],[21,69]];              // vordere Dreiecksfläche
        const L = (a,b) => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
        return { outer:`<polygon points="${pts(h)}"/>`,
          facets:`<polygon class="face-hi" points="${pts(t)}"/>
            ${L(t[0],h[0])}${L(t[0],h[1])}${L(t[0],h[5])}
            ${L(t[1],h[1])}${L(t[1],h[2])}${L(t[1],h[3])}
            ${L(t[2],h[3])}${L(t[2],h[4])}${L(t[2],h[5])}`,
          cy:"55%", vs:.27 };
      }
      case 100:
        return { outer:`<circle cx="50" cy="50" r="46"/>`,
          facets:`<ellipse class="face-hi" cx="50" cy="50" rx="27" ry="24"/>
                  <path d="M9 38 Q30 30 23 50 Q30 70 9 62 M91 38 Q70 30 77 50 Q70 70 91 62
                           M34 9 Q50 22 66 9 M34 91 Q50 78 66 91"/>`,
          cy:"50%", vs:.28 };
    }
  }

  /* ---------- Würfel-Definitionen (Edelstein-Farben) ---------- */
  const DICE = [
    {s:4,   name:"W4",   gem:"#0f5a3a", hi:"#46c98a"},   // Smaragd
    {s:6,   name:"W6",   gem:"#11306e", hi:"#5a8bea"},   // Saphir
    {s:8,   name:"W8",   gem:"#4a1a6b", hi:"#b06ae8"},   // Amethyst
    {s:10,  name:"W10",  gem:"#7a4508", hi:"#eaa83a"},   // Topas
    {s:12,  name:"W12",  gem:"#0b4f5a", hi:"#45bccb"},   // Türkis
    {s:100, name:"W100", gem:"#3a2a1a", hi:"#b08a5c"},   // Bronze
    {s:20,  name:"W20",  gem:"#6e0d12", hi:"#e65050", big:true} // Rubin
  ];

  const defs = document.getElementById("defs");
  const grid = document.getElementById("grid");
  const totalEl = document.getElementById("total");
  const infoEl = document.getElementById("info");
  const state = new Map();   // button -> Ergebnis
  let order = [];            // Reihenfolge der Würfe für die Anzeige

  for (const d of DICE){
    defs.insertAdjacentHTML("beforeend",
      `<radialGradient id="gem${d.s}" cx=".35" cy=".3" r=".8">
         <stop offset="0" stop-color="${d.hi}"/>
         <stop offset=".45" stop-color="${d.gem}"/>
         <stop offset="1" stop-color="#0a0503"/>
       </radialGradient>`);

    const sh = shape(d.s);
    const btn = document.createElement("button");
    btn.className = "die" + (d.big ? " big" : "");
    btn.type = "button";
    btn.style.gridArea = "d" + d.s;
    btn.style.setProperty("--cy", sh.cy);
    btn.style.setProperty("--vs", sh.vs);
    btn.setAttribute("aria-label", d.name + " würfeln");
    btn.innerHTML =
      `<svg viewBox="0 0 100 100" aria-hidden="true">
         <g class="outline" fill="url(#gem${d.s})" stroke="url(#gold)">${sh.outer}</g>
         <g class="facet">${sh.facets}</g>
       </svg>
       <span class="face"><span class="val">${d.name}</span><span class="tag">${d.name}</span></span>`;
    btn.dataset.sides = d.s;
    btn.dataset.name = d.name;
    btn.addEventListener("click", () => onTap(btn));
    grid.appendChild(btn);
  }

  function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }

  function onTap(btn){
    if (btn.classList.contains("rolling")) return;
    if (state.has(btn)) { reset(btn); update(); return; }

    const sides = +btn.dataset.sides;
    const val = btn.querySelector(".val");
    btn.classList.add("rolling");
    buzz(25);

    const spin = setInterval(() => { val.textContent = roll(sides); }, 55);
    btn._timers = [spin];

    btn._timers.push(setTimeout(() => {
      clearInterval(spin);
      const result = roll(sides);
      btn.classList.remove("rolling");
      val.textContent = result;
      void val.offsetWidth;                 // Pop-Animation neu starten
      btn.classList.add("rolled");
      btn.setAttribute("aria-label", `${btn.dataset.name}: ${result}. Tippen zum Zurücksetzen`);
      state.set(btn, result);
      order = order.filter(b => b !== btn); order.push(btn);

      let special = null;
      if (sides === 20 && result === 20){ btn.classList.add("crit"); special = "crit"; buzz([40,60,40,60,120]); }
      else if (sides === 20 && result === 1){ btn.classList.add("fumble"); special = "fumble"; buzz([200]); }
      else buzz(15);
      update(special);
    }, 620));
  }

  function reset(btn){
    (btn._timers || []).forEach(t => { clearInterval(t); clearTimeout(t); });
    btn.classList.remove("rolled","crit","fumble","rolling");
    btn.querySelector(".val").textContent = btn.dataset.name;
    btn.setAttribute("aria-label", btn.dataset.name + " würfeln");
    state.delete(btn);
    order = order.filter(b => b !== btn);
  }

  function update(special){
    if (!state.size){
      totalEl.textContent = "–";
      infoEl.className = "info";
      infoEl.textContent = "Noch nicht gewürfelt";
      return;
    }
    let sum = 0; for (const v of state.values()) sum += v;
    totalEl.textContent = sum;
    if (special === "crit"){
      infoEl.className = "info crit"; infoEl.textContent = "⚔ Natürliche 20 – Kritischer Treffer!";
    } else if (special === "fumble"){
      infoEl.className = "info fumble"; infoEl.textContent = "☠ Natürliche 1 – Patzer!";
    } else {
      infoEl.className = "info";
      infoEl.textContent = order.map(b => `${b.dataset.name}: ${state.get(b)}`).join(" · ");
    }
  }

  document.getElementById("resetAll").addEventListener("click", () => {
    grid.querySelectorAll(".die").forEach(reset);
    update(); buzz(20);
  });
})();
</script>
</body>
</html>
